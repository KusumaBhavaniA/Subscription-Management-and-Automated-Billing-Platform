<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Set a new password for your Billing Platform workspace." />
    <title>Billing Platform - Reset password</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script defer src="../js/services/api.js"></script>
    <script defer src="../js/utils.js"></script>
    <script defer src="../js/theme.js"></script>
    <script defer src="../js/auth.js"></script>
    <script defer src="../js/animations.js"></script>
    <script defer src="../js/login.js"></script>
    <script defer src="../js/dashboard.js"></script>
    <script defer src="../js/app.js"></script>
</head>
<body class="page-shell auth-page">
    <main class="auth-container">
        <div class="auth-card reveal-on-scroll" data-reveal data-mouse-glow>
            <header class="auth-header">
                <div class="brand-lockup brand-lockup--centered">
                    <div class="brand-mark">B</div>
                    <div class="brand-name">Billing Platform</div>
                </div>
                <div class="auth-copy">
                    <h1 class="auth-title">Reset Password</h1>
                    <p class="auth-subtitle">Set a new password for your account</p>
                </div>
                <div class="pill hidden" data-auth-banner>Password updated.</div>
            </header>

            <form class="auth-form" data-reset-form novalidate>
                <div class="field-group form-stack">
                    <label class="form-label" for="reset-password">New Password</label>
                    <div class="input-shell">
                        <input class="field" id="reset-password" name="password" type="password" placeholder="••••••••" autocomplete="new-password" required />
                        <button class="password-toggle ripple" type="button" data-password-toggle="reset-password" aria-label="Toggle password visibility">◔</button>
                    </div>
                    <div class="password-strength" style="margin-top: 6px;">
                        <div class="password-strength-bar"><span class="password-strength-fill" data-strength-meter></span></div>
                        <span class="password-strength-label" data-strength-label>Weak password</span>
                    </div>
                </div>

                <div class="field-group form-stack">
                    <label class="form-label" for="reset-confirm-password">Confirm Password</label>
                    <div class="input-shell">
                        <input class="field" id="reset-confirm-password" name="confirmPassword" type="password" placeholder="••••••••" autocomplete="new-password" required />
                        <button class="password-toggle ripple" type="button" data-password-toggle="reset-confirm-password" aria-label="Toggle password visibility">◔</button>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary ripple" type="submit">
                        <span>Reset Password</span>
                    </button>
                </div>
            </form>

            <p class="auth-footnote">
                Remembered your password? <a class="helper-link" href="login.html">Sign In</a>
            </p>
        </div>
    </main>

    <div data-component="toast"></div>
    <div data-component="loader"></div>
</body>
</html>
