<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recover access to your NexFlow workspace." />
    <title>NexFlow - Recover access</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script defer src="../js/services/api.js"></script>
    <script defer src="../js/utils.js"></script>
    <script defer src="../js/theme.js"></script>
    <script defer src="../js/auth.js"></script>
    <script defer src="../js/animations.js"></script>
    <script defer src="../js/login.js"></script>
    <script defer src="../js/dashboard.js"></script>
    <script defer src="../js/app.js"></script>
</head>
<body class="page-shell auth-page">
    <main class="auth-container">
        <div class="auth-card reveal-on-scroll" data-reveal data-mouse-glow>
            <header class="auth-header">
                <div class="brand-lockup brand-lockup--centered">
                    <img src="../NexFlow.png" alt="NexFlow" style="height: 32px; width: auto; object-contain: contain;" />
                    <div class="brand-name">NexFlow</div>
                </div>
                <div class="auth-copy">
                    <h1 class="auth-title">Forgot Password</h1>
                    <p class="auth-subtitle">Enter your work email to receive a recovery code</p>
                </div>
                <div class="pill hidden" data-auth-banner>OTP prepared.</div>
            </header>

            <form class="auth-form" data-forgot-form novalidate>
                <div class="field-group form-stack">
                    <label class="form-label" for="forgot-email">Email Address</label>
                    <div class="input-shell">
                        <input class="field" id="forgot-email" name="email" type="email" placeholder="name@company.com" autocomplete="email" required />
                    </div>
                    <small class="form-help hidden" data-field-hint></small>
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary ripple" type="submit">
                        <span>Send Recovery Code</span>
                    </button>
                </div>
            </form>

            <p class="auth-footnote">
                Remembered your password? <a class="helper-link" href="login.html">Sign In</a>
            </p>
        </div>
    </main>

    <div data-component="toast"></div>
    <div data-component="loader"></div>
</body>
</html>
