<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to NexFlow, the subscription & billing platform." />
    <title>NexFlow - Sign in</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script defer src="../js/services/api.js"></script>
    <script defer src="../js/utils.js"></script>
    <script defer src="../js/theme.js"></script>
    <script defer src="../js/auth.js"></script>
    <script defer src="../js/animations.js"></script>
    <script defer src="../js/login.js"></script>
    <script defer src="../js/dashboard.js"></script>
    <script defer src="../js/app.js"></script>
</head>
<body class="page-shell auth-page">
    <main class="auth-container">
        <div class="auth-card reveal-on-scroll" data-reveal data-mouse-glow>
            <header class="auth-header">
                <div class="brand-lockup brand-lockup--centered">
                    <img src="../NexFlow.png" alt="NexFlow" style="height: 32px; width: auto; object-contain: contain;" />
                    <div class="brand-name">NexFlow</div>
                </div>
                <div class="auth-copy">
                    <h1 class="auth-title">Welcome Back</h1>
                    <p class="auth-subtitle">Sign in to your account</p>
                </div>
                <div class="pill hidden" data-auth-banner>Authentication complete.</div>
            </header>

            <form class="auth-form" data-login-form novalidate>
                <div class="field-group form-stack">
                    <label class="form-label" for="login-email">Email Address</label>
                    <div class="input-shell">
                        <input class="field" id="login-email" name="email" type="email" placeholder="name@company.com" autocomplete="username" required />
                    </div>
                    <small class="form-help hidden" data-field-hint></small>
                </div>

                <div class="field-group form-stack">
                    <label class="form-label" for="login-password">Password</label>
                    <div class="input-shell">
                        <input class="field" id="login-password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
                        <button class="password-toggle ripple" type="button" data-password-toggle="login-password" aria-label="Toggle password visibility">◔</button>
                    </div>
                    <small class="form-help hidden" data-field-hint></small>
                </div>

                <div class="helper-row">
                    <label class="checkbox">
                        <input name="remember" type="checkbox" /> Remember Me
                    </label>
                    <a class="helper-link" href="forgot-password.html">Forgot Password?</a>
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary ripple" type="submit">
                        <span>Sign In</span>
                    </button>
                </div>
            </form>

            <div class="divider">OR</div>

            <div class="social-grid">
                <button class="btn social-btn ripple" type="button" data-social-login="google">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    <span>Google Sign In</span>
                </button>
            </div>

            <p class="auth-footnote">
                Don't have an account? <a class="helper-link" href="signup.html">Create Account</a>
            </p>
        </div>
    </main>

    <div data-component="toast"></div>
    <div data-component="loader"></div>
</body>
</html>
